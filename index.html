<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>点击按钮换背景色</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Microsoft YaHei", "PingFang SC", sans-serif;
      background-color: #f5f5f5;
      transition: background-color 0.4s ease;
    }

    .panel {
      padding: 40px 48px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      transition: background-color 0.4s ease;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 22px;
      font-weight: 600;
      color: #222;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    button {
      min-width: 96px;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    button:hover  { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.22); }
    button:active { transform: translateY(0);    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); }
    button:focus-visible { outline: 3px solid #333; outline-offset: 3px; }

    .btn-red   { background-color: #e53935; }
    .btn-green { background-color: #43a047; }
    .btn-blue  { background-color: #1e88e5; }

    .hint {
      margin: 26px 0 0;
      font-size: 13px;
      color: #666;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>点击按钮，改变页面颜色</h1>
    <div class="buttons">
      <button class="btn-red"   data-color="#e53935" data-name="红色">红色</button>
      <button class="btn-green" data-color="#43a047" data-name="绿色">绿色</button>
      <button class="btn-blue"  data-color="#1e88e5" data-name="蓝色">蓝色</button>
    </div>
    <p class="hint" id="hint">当前背景：默认</p>
  </div>

  <script>
    document.querySelectorAll('button[data-color]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var color = btn.dataset.color;
        var name  = btn.dataset.name;

        document.body.style.backgroundColor = color;
        document.title = name + ' · 点击按钮换背景色';
        document.getElementById('hint').textContent = '当前背景：' + name;
      });
    });
  </script>
</body>
</html>
